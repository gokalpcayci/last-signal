<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Last Signal launch cards</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  @font-face { font-family: 'Daktilo'; src: url('/fonts/Daktilo-Regular.woff') format('woff'); font-weight: 400; }
  @font-face { font-family: 'Daktilo'; src: url('/fonts/Daktilo-Bold.woff') format('woff'); font-weight: 700; }
  :root { --bg:#0d0e0d; --text:#e6e6df; --dim:#6e706a; --faint:#3d3f3a; --ok:#5fd068; --warn:#e56b47;
    --line:rgba(255,255,255,.07); --mono:'JetBrains Mono',ui-monospace,monospace; --display:'Daktilo',var(--mono); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px var(--mono); font-variant-ligatures: none; }
  .stage { position: absolute; inset: 0; background: radial-gradient(circle at 50% 48%, #151614 0, var(--bg) 65%); }
  /* the app's dashed A–F / 1–5 grid, very faint */
  .grid i { position: absolute; border: 0 dashed var(--line); }
  .grid .v { top: 0; bottom: 0; border-left-width: 1px; }
  .grid .h { left: 0; right: 0; border-top-width: 1px; }
  .lab { position: absolute; font-size: 11px; color: var(--faint); letter-spacing: .2em; }
  .center { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 30px; }
  .kicker { font-size: 15px; letter-spacing: .3em; color: var(--dim); text-transform: uppercase; }
  .big { font: 400 117px/1 var(--display); letter-spacing: -0.05em; white-space: pre; }
  .mid { font: 400 78px/1.05 var(--display); letter-spacing: -0.05em; white-space: pre; }
  .leds { display: flex; gap: 9px; height: 14px; }
  .leds b { width: 14px; height: 14px; background: #1a1b19; }
  .leds b.on { background: var(--text); box-shadow: 0 0 10px rgba(230,230,223,.35); }
  .leds b.ok { background: var(--ok); box-shadow: 0 0 14px rgba(95,208,104,.6); }
  .leds b.warn { background: var(--warn); box-shadow: 0 0 10px rgba(229,107,71,.35); }
  .leds b.off { background: #1a1b19; box-shadow: none; }
  .ok { color: var(--ok); } .warn { color: var(--warn); }
  .url { font-size: 22px; letter-spacing: .14em; color: var(--text); }
  .small { font-size: 13px; letter-spacing: .3em; color: var(--dim); }
  canvas { display: block; }
  .scan { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid" id="grid"></div>
  <div class="center" id="root"></div>
  <div class="scan"></div>
</div>
<script type="module">
import { LedEngine } from '/src/brand/ledEngine.ts'

const q = new URLSearchParams(location.search)
const card = q.get('card') ?? 'hook'
const lang = q.get('lang') === 'tr' ? 'tr' : 'en'
const S = {
  en: { kicker: 'Signal archive · 1966 → now', machines: '46 machines.', worlds: '3 worlds.',
        silent: 'Most went silent.', talking: 'Some are still talking.',
        tag: 'Abandoned, but not forgotten.', event: 'NASA Space Apps Challenge 2026' },
  tr: { kicker: 'Sinyal arşivi · 1966 → bugün', machines: '46 makine.', worlds: '3 dünya.',
        silent: 'Çoğu sustu.', talking: 'Bazıları hâlâ konuşuyor.',
        tag: 'Terk edilmiş ama unutulmamış.', event: 'NASA Space Apps Challenge 2026' },
}[lang]
document.documentElement.lang = lang

// grid + labels like the dashboard frame
const grid = document.getElementById('grid')
for (let i = 1; i < 5; i++) grid.insertAdjacentHTML('beforeend', `<i class="v" style="left:${i * 20}%"></i>`)
for (let i = 1; i < 4; i++) grid.insertAdjacentHTML('beforeend', `<i class="h" style="top:${i * 25}%"></i>`)
'ABCDEF'.split('').forEach((c, i) => grid.insertAdjacentHTML('beforeend',
  `<span class="lab" style="top:12px;left:calc(${i * 20}% + ${i === 5 ? -18 : 10}px)">${c}</span>`))
;[1, 2, 3, 4, 5].forEach((r, i) => grid.insertAdjacentHTML('beforeend',
  `<span class="lab" style="left:12px;top:calc(${i * 25}% + ${i === 4 ? -24 : 10}px)">${r}</span>`))

const root = document.getElementById('root')
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild }
const t0 = performance.now()
const now = () => (performance.now() - t0) / 1000
const GLYPHS = '▓▒░█▪=:.×#/\\<>01'
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }

/** scramble-resolve text into `node` from time `at` over `dur` seconds (deterministic) */
function scramble(node, text, at, dur = 0.5) {
  const chars = [...text]
  return (t) => {
    const p = (t - at) / dur
    if (p < 0) { node.textContent = ''; return }
    node.textContent = chars.map((c, i) => {
      if (c === ' ') return ' '
      const k = i / chars.length
      if (p > k * 0.7 + 0.3) return c
      if (p < k * 0.7) return i < p * chars.length * 1.6 ? GLYPHS[Math.floor(rnd(i + Math.floor(t * 30)) * GLYPHS.length)] : ''
      return GLYPHS[Math.floor(rnd(i * 7 + Math.floor(t * 30)) * GLYPHS.length)]
    }).join('')
  }
}

function ledRow(n) {
  const row = el(`<div class="leds">${'<b></b>'.repeat(n)}</div>`)
  return { row, cells: [...row.children] }
}
// 46 objects in landing order; 9 still talking (3 Moon mirrors, 3 Mars, 3 deep space)
const TALK = new Set([7, 12, 15, 30, 40, 43, 31, 36, 45])

const scenes = {
  hook() {
    const k = el(`<div class="kicker"></div>`), a = el(`<div class="big"></div>`), b = el(`<div class="big"></div>`)
    const { row, cells } = ledRow(46)
    root.append(k, a, b, row)
    const fx = [scramble(k, S.kicker, 0.05, 0.35), scramble(a, S.machines, 0.2, 0.45), scramble(b, S.worlds, 0.75, 0.4)]
    return (t) => {
      fx.forEach((f) => f(t))
      cells.forEach((c, i) => {
        const on = t > 0.25 + i * 0.022
        const flip = t > 1.3 + rnd(i) * 0.4
        c.className = !on ? '' : flip ? (TALK.has(i) ? 'ok' : 'warn') : 'on'
      })
    }
  },
  silent() {
    const a = el(`<div class="big warn"></div>`)
    const { row, cells } = ledRow(46)
    root.append(a, row)
    const f = scramble(a, S.silent, 0.0, 0.35)
    return (t) => {
      f(t)
      cells.forEach((c, i) => {
        if (TALK.has(i)) { c.className = 'ok'; return }
        const die = t > 0.15 + rnd(i + 3) * 0.6
        c.className = !die ? 'warn' : (Math.floor(t * 20 + i) % 3 === 0 && t < 0.15 + rnd(i + 3) * 0.6 + 0.12) ? 'warn' : 'off'
      })
    }
  },
  talking() {
    const a = el(`<div class="big ok"></div>`)
    const { row, cells } = ledRow(9)
    root.append(a, row)
    const f = scramble(a, S.talking, 0.0, 0.4)
    return (t) => {
      f(t)
      // the 3-blink signal blink from the app, staggered
      cells.forEach((c, i) => {
        const ph = (t * 2.4 + i * 0.13) % 1
        c.className = ph < 0.1 || (ph > 0.18 && ph < 0.28) || (ph > 0.36 && ph < 0.46) ? 'ok' : 'off'
      })
    }
  },
  end() {
    const cv = el(`<canvas></canvas>`)
    const name = el(`<div class="big" style="font-weight:400;letter-spacing:.02em;margin-top:6px"></div>`)
    const tag = el(`<div class="mid" style="font-size:39px;color:var(--dim)"></div>`)
    const url = el(`<div class="url"></div>`)
    const ev = el(`<div class="small"></div>`)
    root.append(cv, name, tag, url, ev)
    root.style.gap = '26px'
    const led = new LedEngine(cv, { grid: 'coarse', mode: 'boot', glitch: 1, signals: true })
    led.resize(330)
    led.play('intro').then(() => led.play('ambient'))
    const fx = [scramble(name, 'LAST SIGNAL', 0.25, 0.4), scramble(tag, S.tag, 0.55, 0.4),
      scramble(url, 'lastsignal.earth', 0.85, 0.35), scramble(ev, S.event.toUpperCase(), 1.0, 0.35)]
    return (t) => fx.forEach((f) => f(t))
  },
}

await document.fonts.ready
const tick = scenes[card]()
const loop = () => { tick(now()); requestAnimationFrame(loop) }
loop()
window.__ready = true
</script>
</body>
</html>
